# Alembic configuration for PrakritiAI.
#
# The database URL is intentionally left as a placeholder here.
# env.py reads DATABASE_URL from the application Settings object
# (which in turn reads backend/.env) so this value is never used
# in practice.  Alembic requires the key to exist in the file,
# but the value is overridden in env.py before any connection is made.

[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder — overridden by env.py via app settings.
sqlalchemy.url = sqlite:///./prakriti_ai.db

# Logging — mirrors the application log level for consistency.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
